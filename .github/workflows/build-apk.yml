name: Build and Release CALCORA APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calcora-latest-release
  cancel-in-progress: false

jobs:
  build-release:
    name: Test, build, and publish Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36.1" "build-tools;36.1.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit and Robolectric tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build installable debug APK
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew --no-daemon -PcalcoraVersionCode="$((100000 + APP_VERSION_CODE))" -PcalcoraVersionName="$APP_VERSION_NAME" assembleDebug

      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Calcora.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: calcora-apk
          path: app/build/outputs/apk/debug/Calcora.apk
          if-no-files-found: error
          retention-days: 14

      - name: Move the rolling latest tag to this commit
        run: |
          git tag --force latest "$GITHUB_SHA"
          git push --force origin refs/tags/latest

      - name: Publish APK to the latest GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: CALCORA latest
          body: |
            Installable Android debug build for commit `${{ github.sha }}`.

            CALCORA's calculator features run offline on the device.
          files: app/build/outputs/apk/debug/Calcora.apk
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
          draft: false
          prerelease: false